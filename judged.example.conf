# judged.conf: one line per thing. Copy to ~/.config/judged/judged.conf.
# directive  arguments  key=value ...      # comments, "quotes" for spaces, trailing \ continues a line.
# A typo in a directive or key is an error with the line number, never a silently disabled check.

# --- alerts ---------------------------------------------------------------------------------------------
# Apprise URLs (discord://, tgram://, matrix://, mailtos://, ...) hold tokens: keep them in the file below
# (mode 600) or in JUDGED_NOTIFY, never here and never in the repo.
notify lead_days=30,14,7,1 urls_file=~/.config/judged/notify

# --- what expires ---------------------------------------------------------------------------------------
tls    github.com                          # certificate of a host
gpg                                        # every expiring key in the local keyring
domain example.com                         # registration expiry (RDAP)
site   www.example.com images=1           # redirect, security headers, cookies, security.txt, DNSSEC, images that are not WebP (images=0 switches that off)
date   "example licence" 2027-03-01
licence "IDE seats" 2027-03-01 vendor=ExampleSoft cost=1200 currency=EUR owner=dev auto_renews=no
contract "Hosting" 2027-03-31 type=supplier notice_days=90 auto_renews=1 term_months=12 cost=24000 currency=EUR owner=anna vendor=Acme   # alert = last day to give notice

# --- who you are ----------------------------------------------------------------------------------------
company regions=EU,PL mail_domains=example.com        # regions filter `judged obligations`; SPF/DMARC per domain
obligation iso27001-surveillance last_done=2026-05-01 # a periodic duty you track; ids are in catalog.conf

# --- certificates: judged supervises, your ACME client issues -------------------------------------------
renew www.example.com cmd="certbot renew --cert-name www.example.com" reload="systemctl reload nginx" when_days=21

# a GPG key you named by its full fingerprint: judged extends its expiry when fewer than when_days are left, then reads it back. It does not publish the key.
# renew gpg:0123456789ABCDEF0123456789ABCDEF01234567 when_days=30 extend_by=2y

# --- secrets and licences -------------------------------------------------------------------------------
# repos: secret-named files, token shapes, .gitignore coverage, your own user name, home folder and e-mail. scan_paths: chat logs.
secrets  repos=~/dev/* history=no scan_paths=~/.claude/projects extra_terms=internal-codename entropy=1 max_file_mb=1 emails=1 email_accept=security@example.com
agents   enabled=1 repos=~/dev/* mcp_accept=filesystem,github skip=
# licences you USE: Python site-packages, classified; deny fails the audit
licences envs=~/dev/*/.venv/lib/python*/site-packages deny=AGPL
# lockfiles of every project -> vulnerabilities (OSV) and licences (deps.dev); only public package names are sent
deps     projects=~/dev/* deny=AGPL max_lookups=300

# Options not used above are still written down on purpose (a missing option is an error); defaults shown.
notify urls= via=auto notts=notts
licences reviewed_packages=
flatpak enabled=1 accept= ignore= leftovers=1
containers enabled=0 projects= accept= max_image_age_days=180 scan=1 max_scan_mb=1000 max_images=10
# Host hardening audits (judged/hardening, one file per audit). skip = audit names to leave out: sysctl ssh_server ssh_keys suid sudoers logging
hardening enabled=1 skip= accept_ports= sysctl_accept= suid_paths=/usr,/etc suid_accept= sudoers_accept= ssh_strict_forwarding=0 ssh_dir=~/.ssh ssh_key_max_age_days=730 ssh_min_rsa_bits=3072 ssh_keys_accept=
# File integrity baseline: `judged integrity init` makes it, `judged integrity accept` replaces it after you reviewed `judged integrity show`.
integrity enabled=0 paths= exclude= max_filesize_mb=100 max_files=200000 baseline=
# Links: broken symlinks, links into /tmp, setuid files with several names. Report only, nothing is repaired. `judged links` lists every link.
links enabled=0 paths= exclude= max_files=200000

# GitHub hygiene through `gh api` (metadata only): token expiry, secret-scanning alerts, deploy keys, Actions secrets age.
github enabled=0 owner= skip= max_repos=100 token_warn_days=14 deploy_key_max_age_days=365 secret_max_age_days=365 deploy_keys_accept=

# Backup evidence: tool = folder | restic | borg (judged/backups). restore_tested = date of your last real restore test.
backup enabled=0 tool=folder repo= password_file= max_age_hours=36 must_include= restore_tested= restore_tested_file= restore_max_age_days=365
malware enabled=0 paths= database= max_db_age_days=3 timeout=3600 exclude= max_filesize_mb=100 accept=
