# The shipped catalog, same format as judged.conf.
# The Cyber Essentials controls are judged's own wording of NCSC "Requirements for IT Infrastructure" v3.3
# (April 2026); no person or assessor has reviewed them and the official text decides (`source ce-requirements`
# below alerts on a new version). confirm=yes: such a control passes only with a person's statement.
# EVERYTHING ELSE here is typed from memory and NOT verified against the official texts (ISO 27001 is paid:
# ids only). Whether a duty applies to a company (sector, size, role) needs a human. `verify` names the
# source to check; a duty without `reviewed=YYYY-MM-DD` (or older than 180 days) prints as [UNREVIEWED].

framework ce 'Cyber Essentials' confirm=yes
# Scope
control ce scope 'Scope written down: every device and cloud service that meets the internet, personal and home-working devices that reach company data, and all company accounts, third-party ones included'
# Firewalls
control ce fw-every-device 'Firewalls: every device in scope is behind a correctly configured firewall, its own or a network device'
control ce fw-admin-password 'Firewalls: the default admin password is replaced by a strong unique one, or remote admin is off'
control ce fw-admin-internet 'Firewalls: the admin page is closed to the internet; an exception has a written business need and MFA, or an IP allow list with a managed password'
control ce fw-inbound-default 'Firewalls: inbound connections that are not authenticated are blocked by default'
control ce fw-rules-approved 'Firewalls: each inbound rule is approved by an authorised person and written down with its business need'
control ce fw-rules-removed 'Firewalls: rules no longer needed are removed or disabled'
control ce fw-untrusted-networks 'Firewalls: a software firewall is on for devices used on networks you do not control, such as public wifi'
# Secure configuration
control ce cfg-accounts 'Configuration: accounts nobody needs, such as guest or unused admin accounts, are removed or disabled'
control ce cfg-passwords 'Configuration: no default or guessable account password is left'
control ce cfg-software 'Configuration: applications, system tools and network services nobody needs are removed or disabled'
control ce cfg-autorun 'Configuration: no auto-run feature starts a file without the user allowing it'
control ce cfg-authenticate 'Configuration: users are authenticated before they reach company data or services'
control ce cfg-unlock 'Configuration: using a device in person takes a biometric, password or PIN; one used only to unlock has at least 6 characters, one also used to sign in follows the password requirements'
control ce cfg-unlock-guessing 'Configuration: unlocking is protected from guessing (growing delays with at most 10 tries in 5 minutes, or lock after at most 10 failures); where this cannot be set, the vendor default'
# Security update management
control ce upd-supported 'Updates: all software is licensed and still supported'
control ce upd-unsupported 'Updates: unsupported software is removed, or kept in a defined sub-set with no traffic to or from the internet'
control ce upd-automatic 'Updates: automatic updates are on wherever possible'
control ce upd-14-days 'Updates: a fix is installed within 14 days of release if the vendor calls it critical or high risk, its CVSS v3 base score is 7 or more, or the vendor gives no severity; the same for a bundle that holds one'
# User access control
control ce acc-process 'Access: accounts are created and approved through a set process'
control ce acc-unique 'Access: each user signs in with their own credentials'
control ce acc-leavers 'Access: accounts no longer needed (leavers, long inactive) are removed or disabled, third-party accounts included'
control ce acc-mfa 'Access: MFA is on wherever it is offered, and on every cloud service without exception'
control ce acc-admin-separate 'Access: admin work has its own accounts, never used for e-mail, web browsing or other daily work'
control ce acc-privileges 'Access: special rights are removed or disabled when no longer needed'
control ce acc-guessing 'Access: passwords are protected from guessing by at least one of MFA, growing delays with at most 10 tries in 5 minutes, or lock after at most 10 failures'
control ce acc-password-quality 'Access: password quality is enforced by one of MFA (password part at least 8), at least 12 characters, or at least 8 with common passwords blocked; never a maximum length'
control ce acc-password-help 'Access: people are helped to pick unique passwords (what to avoid, three or more words, a password manager or locked storage), with no forced expiry and no complexity rules'
control ce acc-compromised 'Access: there is a process to change a password promptly when it or the account may be compromised'
# Malware protection
control ce mal-protection 'Malware: every device has active, up to date protection, at least one of application allow listing (any device; the Linux option) or anti-malware software (listed for Windows and macOS only) that stops malware and malicious code from running and blocks malicious websites'
control ce mal-allowlist 'Malware, where allow listing is used: only code-signed applications approved before deployment run, the approved list is kept current, users cannot install unsigned or badly signed ones'

framework gdpr GDPR
control gdpr art5-1f 'Art. 5(1)(f) Integrity and confidentiality'
control gdpr art25 'Art. 25 Data protection by design and by default'
control gdpr art28 'Art. 28 Processor'
control gdpr art30 'Art. 30 Records of processing activities'
control gdpr art32 'Art. 32 Security of processing'
control gdpr art33 'Art. 33 Breach notification to the authority'

framework iso27001 'ISO/IEC 27001:2022 Annex A (subset)'
control iso27001 A.5.15 'Access control'
control iso27001 A.5.19 'Information security in supplier relationships'
control iso27001 A.5.20 'Addressing information security within supplier agreements'
control iso27001 A.5.17 'Authentication information'
control iso27001 A.8.2 'Privileged access rights'
control iso27001 A.8.5 'Secure authentication'
control iso27001 A.8.7 'Protection against malware'
control iso27001 A.8.8 'Management of technical vulnerabilities'
control iso27001 A.8.9 'Configuration management'
control iso27001 A.8.13 'Information backup'
control iso27001 A.8.15 Logging
control iso27001 A.8.20 'Networks security'
control iso27001 A.8.24 'Use of cryptography'
control iso27001 A.8.28 'Secure coding'

duty ce-cert \
     region=UK \
     framework='Cyber Essentials' \
     cadence_days=365 \
     title='Renew the Cyber Essentials certificate' \
     verify='NCSC / IASME: certificate validity (believed 12 months)'

duty iso27001-surveillance \
     region=EU,UK,PL,US \
     framework='ISO/IEC 27001' \
     cadence_days=365 \
     title='Annual surveillance audit by the certification body' \
     verify='your certification body'"'"'s contract (believed: annual in a 3-year cycle)'

duty iso27001-recert \
     region=EU,UK,PL,US \
     framework='ISO/IEC 27001' \
     cadence_days=1095 \
     title='Recertification audit' \
     verify='your certification body'"'"'s contract (believed: every 3 years)'

duty gdpr-ropa-review \
     region=EU,PL,UK \
     framework=GDPR \
     cadence_days=365 \
     title='Review the record of processing activities (good practice, not a fixed legal interval)' \
     verify='GDPR Art. 30 (Regulation (EU) 2016/679); the interval is practice, not law'

duty gdpr-breach \
     region=EU,PL,UK \
     framework=GDPR \
     deadline='without undue delay and where feasible within 72 hours of becoming aware, unless unlikely to risk people'"'"'s rights' \
     title='Notify the supervisory authority of a personal data breach (PL: UODO, UK: ICO)' \
     verify='GDPR Art. 33; UK GDPR Art. 33'

duty nis2-incident \
     region=EU \
     framework=NIS2 \
     deadline='early warning within 24 h, incident notification within 72 h, final report within one month' \
     title='Report a significant incident (essential and important entities only; applicability needs a human)' \
     verify='Directive (EU) 2022/2555 Art. 23 and the national transposition'

duty cra-vuln \
     region=EU \
     framework='Cyber Resilience Act' \
     deadline='early warning within 24 h (believed to apply from 11 Sep 2026; check)' \
     title='Report an actively exploited vulnerability in a product with digital elements (manufacturers)' \
     verify='Regulation (EU) 2024/2847, reporting obligations and their application dates'

# --- official texts watched for changes (judged/areas/feeds_area.py); every address answered on 2026-11-25 ---
# EU: the act itself plus every act EUR-Lex records as amending it (corrigenda and guidance are not covered).
source eu-gdpr name="GDPR amendments (EUR-Lex)" \
     url="https://publications.europa.eu/webapi/rdf/sparql?format=application%2Fsparql-results%2Bjson&query=PREFIX%20cdm%3A%20%3Chttp%3A%2F%2Fpublications.europa.eu%2Fontology%2Fcdm%23%3E%20SELECT%20DISTINCT%20%3Fc%20WHERE%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fb%20.%20FILTER%28str%28%3Fb%29%3D%2232016R0679%22%29%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20UNION%20%7B%20%3Fact%20cdm%3Aresource_legal_amends_resource_legal%20%3Fbase%20.%20%3Fact%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20%7D" \
     match='3[0-9]{4}[A-Z][0-9]{4}'
source eu-nis2 name="NIS2 amendments (EUR-Lex)" \
     url="https://publications.europa.eu/webapi/rdf/sparql?format=application%2Fsparql-results%2Bjson&query=PREFIX%20cdm%3A%20%3Chttp%3A%2F%2Fpublications.europa.eu%2Fontology%2Fcdm%23%3E%20SELECT%20DISTINCT%20%3Fc%20WHERE%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fb%20.%20FILTER%28str%28%3Fb%29%3D%2232022L2555%22%29%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20UNION%20%7B%20%3Fact%20cdm%3Aresource_legal_amends_resource_legal%20%3Fbase%20.%20%3Fact%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20%7D" \
     match='3[0-9]{4}[A-Z][0-9]{4}'
source eu-dora name="DORA amendments (EUR-Lex)" \
     url="https://publications.europa.eu/webapi/rdf/sparql?format=application%2Fsparql-results%2Bjson&query=PREFIX%20cdm%3A%20%3Chttp%3A%2F%2Fpublications.europa.eu%2Fontology%2Fcdm%23%3E%20SELECT%20DISTINCT%20%3Fc%20WHERE%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fb%20.%20FILTER%28str%28%3Fb%29%3D%2232022R2554%22%29%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20UNION%20%7B%20%3Fact%20cdm%3Aresource_legal_amends_resource_legal%20%3Fbase%20.%20%3Fact%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20%7D" \
     match='3[0-9]{4}[A-Z][0-9]{4}'
source eu-cra name="Cyber Resilience Act amendments (EUR-Lex)" \
     url="https://publications.europa.eu/webapi/rdf/sparql?format=application%2Fsparql-results%2Bjson&query=PREFIX%20cdm%3A%20%3Chttp%3A%2F%2Fpublications.europa.eu%2Fontology%2Fcdm%23%3E%20SELECT%20DISTINCT%20%3Fc%20WHERE%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fb%20.%20FILTER%28str%28%3Fb%29%3D%2232024R2847%22%29%20%7B%20%3Fbase%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20UNION%20%7B%20%3Fact%20cdm%3Aresource_legal_amends_resource_legal%20%3Fbase%20.%20%3Fact%20cdm%3Aresource_legal_id_celex%20%3Fc%20%7D%20%7D" \
     match='3[0-9]{4}[A-Z][0-9]{4}'
# Cyber Essentials: the file name of the requirements document carries its version.
source ce-requirements name="Cyber Essentials requirements (NCSC)" url="https://www.ncsc.gov.uk/cyberessentials/resources" \
     match='Cyber-Essentials-Requirements-for-IT-Infrastructure-v[0-9-]+[.]pdf'
source ce-scheme name="Cyber Essentials scheme overview (GOV.UK)" url="https://www.gov.uk/api/content/government/publications/cyber-essentials-scheme-overview" \
     match='"public_timestamp":"[^"]+"'
# Poland: ids of the acts the Sejm database links to the act; a new amendment adds one.
source pl-uodo name="Polish Data Protection Act, linked acts (Sejm ELI)" url="https://api.sejm.gov.pl/eli/acts/DU/2018/1000" match='DU/20[0-9]{2}/[0-9]+'
